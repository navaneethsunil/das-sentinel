# DAS Sentinel — local/self-hosted stack (single node, air-gap friendly).
#
# Topology from M0-I2. api (M0-B1) and web (M0-F1) are live; worker runs the api image
# with a stub command until M0-W1. Requires `.env` (copy from `.env.example`).
#
# Invariants enforced here (CLAUDE.md §3, ARCHITECTURE.md, TRD §2):
#   - only `proxy` publishes a host port (:443); all other traffic is on the internal network (TR-4)
#   - `--init` (init: true) on `worker` for zombie reaping / signal forwarding (§6a, TM-12)
#   - deploy.resources.limits on every service (a runaway scan must not starve the DB) (TM-12)
#   - healthchecks + depends_on: service_healthy so dependents wait for their backing services
#   - image tags pinned now; digest-pin (…@sha256:) is a follow-up per TR-25
#
# NOTE (evidence backend): MinIO OSS repo was archived 2026-04-25 — this is a DEV-ONLY store behind
# the future storage/ abstraction. The production WORM backend is a tracked gate (ROADMAP.md).

name: das-sentinel

# C2 (GO-LIVE): bounded local log rotation so a long scan can't fill the disk.
# Applied to the long-running app services below via `logging: *default-logging`.
# Off-box shipping is the profile-gated `logshipper` (Vector) service at the tail.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    # Digest-pinned per CLAUDE.md §3 (TR-25). Bump via `docker buildx imagetools
    # inspect --format '{{.Manifest.Digest}}' postgres:17`.
    image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dassentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-dassentinel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  valkey:
    # Digest-pinned per CLAUDE.md §3 (TR-25).
    image: valkey/valkey:8@sha256:495e4fecdc98ee48a20b207726caa5ab6451e0fac3642a9be10d9e70b3068df6
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  minio:
    # Digest-pinned per CLAUDE.md §3 (TR-25). DEV-ONLY evidence store (OSS MinIO is
    # archived); the pinned `seaweedfs` profile is the prod WORM path. Frozen tag →
    # digest won't move; bump via `docker buildx imagetools inspect --format
    # '{{.Manifest.Digest}}' minio/minio:latest` only if the tag is re-cut.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dassentinel}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-devpassword}
    volumes:
      - minio-data:/data
    healthcheck:
      # Recent MinIO images may not ship curl; if this reports unhealthy, swap to an mc-based
      # readiness check (dev-only — tracked with the evidence-backend gate).
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  seaweedfs:
    # Evidence-store WORM backend candidate (ROADMAP evidence-backend gate).
    # Apache-2.0, single binary, S3-compatible with COMPLIANCE object-lock —
    # empirically verified WORM-capable by scripts/verify_worm.py (the locked
    # object VERSION cannot be deleted during retention). Chosen over MinIO OSS
    # (AGPLv3 + archived 2026-04-25) for the lightweight self-hosted / air-gapped
    # footprint; Ceph RGW remains the pick for large-scale/multi-site or where a
    # vendor WORM certification is mandated. Digest-pinned (v4.40); behind the
    # `seaweedfs` profile so it is NOT in the default stack or CI image scans.
    # Point the evidence store at it with MINIO_ENDPOINT=seaweedfs:8333,
    # MINIO_SECURE=false:  docker compose --profile seaweedfs up -d seaweedfs
    image: chrislusf/seaweedfs@sha256:52194fba4fecd0083c842158b3a902ba6e04a63619b2b0efcd08007bdb6a4602
    command: ["server", "-s3", "-dir=/data"]
    profiles: ["seaweedfs"]
    volumes:
      - seaweedfs-data:/data
    networks: [internal]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: runtime   # lean base image; never the monitoring/redteam stages
    # One-shot (M0-D1): applies Alembic migrations and exits 0; api and worker
    # gate on service_completed_successfully so they never see a stale schema.
    # DB-readiness gate = postgres healthcheck (pg_isready) via depends_on.
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: runtime   # lean base image; never the monitoring/redteam stages
    # Runtime config comes exclusively from .env (copy .env.example → .env);
    # secrets never bake into the image (TR-23).
    env_file: .env
    # A locally-run model server (Ollama) listens on the operator's HOST, which is
    # not this container's loopback. Docker Desktop provides this alias implicitly;
    # declaring it makes a registered `localhost` endpoint resolve on plain Linux
    # Docker too (app/services/ai_models.py: endpoint_candidates).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Liveness only (/healthz): a DB/Valkey outage must not restart-loop the API.
      # Readiness (/readyz) is asserted by the smoke test (M0-T1).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: runtime   # lean base image; never the monitoring/redteam stages
    # Same image as api with the CMD overridden (M0-W1). Concurrency stays modest:
    # scanner tasks are long-running subprocesses, not CPU-bound Python (§6a).
    # Consumes only the default `celery` queue (ping, evidence sweep). Scan runs
    # are routed to the redteam/scanners queues, which this base image lacks the
    # tools for — so it never picks up a scan it cannot run (T1).
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker",
              "--loglevel=INFO", "--concurrency=2", "-Q", "celery"]
    env_file: .env
    init: true            # tini: reap re-parented scanner children, forward signals (§6a)
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Liveness via the broker: the worker answers a ping addressed to itself.
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping -d celery@$$(hostname) --timeout 10 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  redteam-worker:
    # M2-B3: the PyRIT-backed worker. Built from the `redteam` image target, which
    # adds the hash-pinned PyRIT bundle on top of the runtime image. Kept behind the
    # `redteam` profile so it is NOT part of the default stack, the CI `images`
    # build (`--profile dev build`), or the Trivy image scan (api/web only) — its
    # 107-package ML footprint stays isolated from the base gates. Bring it up for
    # AI/LLM suites: `docker compose --profile redteam up -d redteam-worker`.
    # Task routing of PyRIT suites onto this worker lands with M2-B4/B6.
    profiles: ["redteam"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: redteam
    # Consumes the `redteam` queue: LLM-suite scans (PyRIT) route here (T1).
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker",
              "--loglevel=INFO", "--concurrency=2", "--hostname=redteam@%h",
              "-Q", "redteam"]
    env_file: .env
    init: true            # reap re-parented children, forward signals (§6a)
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  scanner-worker:
    # M3-W2: the Semgrep-backed worker. Built from the `scanners` image target,
    # which adds the hash-pinned Semgrep bundle on top of the runtime image. Kept
    # behind the `scanners` profile so it is NOT part of the default stack, the CI
    # `images` build (`--profile dev build`), or the Trivy image scan (api/web
    # only) — its scanner-tool footprint stays isolated from the base gates. Bring
    # it up for scanner scans: `docker compose --profile scanners up -d scanner-worker`.
    # The vendored, content-hashed rule bundle is mounted read-only (see Dockerfile
    # `scanners` stage). Task routing of scanner scans onto this worker is the
    # deferred production-wiring task (like the redteam queue).
    profiles: ["scanners"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: scanners
    # Consumes the `scanners` queue: scanner scans (semgrep/ZAP) route here (T1).
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker",
              "--loglevel=INFO", "--concurrency=2", "--hostname=scanners@%h",
              "-Q", "scanners"]
    env_file: .env
    init: true            # reap re-parented children, forward signals (§6a)
    volumes:
      - ./security/semgrep-rules:/app/security/semgrep-rules:ro
      - ./security/nuclei-templates:/app/security/nuclei-templates:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  zap:
    # M3-W3: the ZAP DAST daemon. Digest-pinned (CLAUDE.md §3 scanner pinning) —
    # same image the CI DAST job runs. Driven over its API by the ZapScanner
    # adapter; the API key is a runtime secret from the env, NEVER persisted into
    # scanner_runs.config/evidence/logs. api.addrs.* allows the internal
    # scanner-worker to reach the API (the daemon is internal-network only, no
    # host port). _JAVA_OPTIONS sizes the JVM heap under the container limit.
    # Behind the `scanners` profile: not in the default stack or CI image builds.
    profiles: ["scanners"]
    image: ghcr.io/zaproxy/zaproxy@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8090"
      - -config
      - api.key=${ZAP_API_KEY:-change-me}
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
    environment:
      _JAVA_OPTIONS: "-Xmx1024m"
    init: true
    restart: unless-stopped
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  vuln-target:
    # M3-W3: a deliberately-insecure web target (sandbox/vuln_web.py) for the ZAP
    # adapter's live proof — serves header-less responses ZAP passively flags.
    # Internal-network only, behind the `scanners` profile. NEVER a real target.
    profiles: ["scanners"]
    # Digest-pinned per CLAUDE.md §3 (TR-25); same base as the api image.
    image: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
    command: ["python", "/sandbox/vuln_web.py"]
    volumes:
      - ./sandbox:/sandbox:ro
    init: true
    restart: unless-stopped
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  tls-target:
    # M4 recon: a lightweight HTTPS target (internal-CA cert) for the testssl.sh
    # adapter's live proof — Caddy serving TLS on :443 with no upstreams. Internal
    # network only, behind the `scanners` profile. NEVER a real target.
    profiles: ["scanners"]
    # Digest-pinned per CLAUDE.md §3 (TR-25); same base as the proxy.
    image: caddy:2@sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9
    command: ["caddy", "run", "--config", "/etc/caddy/TargetCaddyfile"]
    volumes:
      - ./sandbox/tls_target.Caddyfile:/etc/caddy/TargetCaddyfile:ro
    init: true
    restart: unless-stopped
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  juice-shop:
    # M3-T1: OWASP Juice Shop — the canonical vulnerable app, the T1 target for
    # both the ZAP DAST baseline (over the internal network) and the Semgrep SAST
    # scan (its backend source is extracted from THIS pinned image by
    # sandbox/extract_juice_shop_source.sh). Single self-contained container (no
    # external DB). Digest-pinned (CLAUDE.md §3), internal-only, behind the
    # `scanners` profile — never in the default stack or CI image builds. NEVER a
    # real target. The image has no shell, so the healthcheck uses node directly.
    profiles: ["scanners"]
    image: bkimminich/juice-shop@sha256:e68144772ebaaca0ec117b38d44903af92416793230288ef7c5437fc4f26850a
    init: true
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G

  flower:
    # DEV ONLY (M0-W1): Celery monitoring UI. flower==2.0.1 (last release, 2023-08)
    # pinned in the image's `monitoring` group so it runs the same Celery as the
    # worker. Not part of the default stack: `docker compose --profile dev up -d flower`.
    # Publishing 127.0.0.1:5555 is a deliberate dev-only exception to the
    # single-ingress rule (TR-4) — loopback-bound, never 0.0.0.0, no prod profile.
    profiles: ["dev"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: monitoring
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "flower",
              "--address=0.0.0.0", "--port=5555"]
    env_file: .env
    ports:
      - "127.0.0.1:5555:5555"
    # Waits for the worker: Flower populates its worker-inspect cache at boot, so
    # starting before the worker leaves the /worker detail views empty.
    depends_on:
      valkey:
        condition: service_healthy
      worker:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    # Least privilege: web gets ONLY what it needs — no env_file (DB/MinIO/LLM
    # secrets stay out of the frontend container).
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Distroless has no shell/curl/wget; global fetch is built in. node is at
      # the distroless entrypoint path (not on PATH), so call it absolutely.
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  proxy:
    # Digest-pinned per CLAUDE.md §3 (TR-25).
    image: caddy:2@sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9
    # The ONLY service that publishes a host port (single ingress — TR-4).
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      # Caddy's admin API is on localhost:2019; the alpine image ships busybox wget.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # C2 (GO-LIVE): off-box log shipper. Socket-free — tails the json-file logs
  # read-only (no docker.sock exposure). Profile-gated: NOT in the default stack
  # or CI scans, and it only starts when you opt in AND set VECTOR_SINK_ADDR:
  #   docker compose --profile logging up -d logshipper
  # Point VECTOR_SINK_ADDR at your syslog/Loki/Vector host on a separate box.
  logshipper:
    image: timberio/vector:0.41.1-debian@sha256:87ef5d0a3f47ed6e415c9c6b84f7bfa53dbced55c00b75a974426a8a63cebc15
    profiles: ["logging"]
    # VECTOR_SINK_ADDR must be set when this profile is up (an empty address makes
    # Vector fail loud at start — nothing ships by accident). Plain `:-` default so
    # `docker compose config` for the DEFAULT stack never trips on this gated service.
    environment:
      VECTOR_SINK_ADDR: ${VECTOR_SINK_ADDR:-}
    volumes:
      - ./security/vector.toml:/etc/vector/vector.toml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - logshipper-data:/var/lib/vector
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  minio-data:
  seaweedfs-data:
  caddy-data:
  caddy-config:
  logshipper-data:
